---

- name: Remove the legacy NodeSource repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodejs.list
    state: absent
  register: node_legacy_repository

- name: Install NodeSource repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    cache_valid_time: 3600

- name: Configure the NodeSource APT repository
  ansible.builtin.deb822_repository:
    name: nodejs
    uris: "https://deb.nodesource.com/node_{{ node_version }}.x"
    suites: "{{ ansible_facts['distribution_release'] if node_legacy_branch else 'nodistro' }}"
    components: main
    signed_by: "https://deb.nodesource.com/gpgkey/{{ 'nodesource.gpg.key' if node_legacy_branch else 'nodesource-repo.gpg.key' }}"
    state: present
  vars:
    node_legacy_branch: "{{ node_version | int < 18 }}"
  register: node_repository

- name: Refresh the APT cache after NodeSource repository changes
  ansible.builtin.apt:
    update_cache: true
  when: node_legacy_repository is changed or node_repository is changed

- name: nodejs and needed packages present
  ansible.builtin.apt:
    pkg:
      - build-essential
      - nodejs
    state: present
